// gRPC service contracts for the SyncApp microservice split. Each domain service
// (auth, chat, message, presence, key directory) is exposed here so it can run as
// a standalone process; the gateway calls them as gRPC clients that satisfy the
// same Go interfaces the in-process services do (internal/gateway/services.go).
//
// Generated Go lands in internal/rpc/pb. Regenerate with:  make proto
syntax = "proto3";

// Distinct proto package from body.proto (syncapp.v1): both are linked into the
// same binaries (the gateway/daemons use the wire bodies AND these RPCs), and a
// shared proto package + duplicate message names (e.g. KeyBundle) would collide
// in the global protobuf registry at init.
package syncapp.rpc.v1;

option go_package = "github.com/IR-Full/sync-app/server/internal/rpc/pb;rpcpb";

// ---- domain messages (mirror internal/model) ----

message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  int64 created_at = 4;
  string avatar_ref = 5;
  // Privacy settings travel with the user, so a split deployment enforces the
  // same rules as the monolith. Omitting them is exactly the topology drift the
  // risk register names: a field the monolith honours that the gRPC contract
  // drops, turning a privacy setting into a no-op for whoever enabled sharding.
  string privacy_last_seen = 6;
  string privacy_avatar = 7;
  string privacy_groups = 8;
  // Whether message text may reach the push provider. Carried here for the same
  // reason as the others: a setting that the split deployment drops is a setting
  // that becomes a no-op for whoever enabled sharding — and this one failing open
  // would hand plaintext to a third party.
  bool privacy_push_preview = 9;
}

message Session {
  string id = 1;
  string user_id = 2;
  string device_id = 3;
  string token = 4;
  string resume_token = 5;
  int64 created_at = 6;
  int64 expires_at = 7;
  int64 revoked_at = 8;
  // The resume token this session most recently rotated away from. Carried across
  // the split for the same reason every other field is: a value the gRPC wiring
  // drops is a feature that vanishes when somebody enables sharding — and this one
  // is what makes a stolen resume token detectable.
  string prev_resume_token = 9;
  int64 resume_rotated_at = 10;
}

message Chat {
  string id = 1;
  string type = 2;
  string title = 3;
  string owner_id = 4;
  int64 created_at = 5;
  uint64 last_seq = 6;
  string username = 7;
}

message ChatMember {
  string chat_id = 1;
  string user_id = 2;
  string role = 3;
  int64 joined_at = 4;
  bool muted = 5;
  // The member's own per-chat settings. muted above is the legacy boolean kept in
  // step with muted_until; muted_until is what the notification path reads.
  int64 muted_until = 6;
  bool pinned = 7;
  bool archived = 8;
}

// Attachment and ForwardOrigin mirror their body.proto twins field for field.
// They are redeclared rather than imported because the two files are deliberately
// separate proto packages (see the note at the top): the shapes are the same
// domain types crossing a different boundary — service-to-service, not
// client-to-server.
message Attachment {
  string kind = 1;
  string media_ref = 2;
  string filename = 3;
  string mime = 4;
  int64 size = 5;
  int64 duration_ms = 6;
  repeated int32 waveform = 7;
  int32 width = 8;
  int32 height = 9;
  string thumb_ref = 10;
}

message ForwardOrigin {
  string chat_id = 1;
  string message_id = 2;
  string sender_id = 3;
}

// Message must carry EVERY field a client can observe: the gateway renders its
// wire body straight from this, so a field missing here is a field no client on
// the split deployment can ever see — even though the monolith shows it.
message Message {
  string id = 1;
  string chat_id = 2;
  string sender_id = 3;
  uint64 seq = 4;
  string text = 5;
  string media_ref = 6;
  string reply_to = 7;
  bool edited = 8;
  bool deleted = 9;
  int64 created_at = 10;
  int64 edited_at = 11;
  Attachment attachment = 12;
  string thread_root = 13;
  int32 reply_count = 14;
  ForwardOrigin forward = 15;
  int64 expires_at = 16;
}

// ---- Auth service ----

message RegisterRequest {
  string username = 1;
  string password = 2;
  string display_name = 3;
  string device_id = 4;
  string platform = 5;
}
message LoginRequest {
  string username = 1;
  string password = 2;
  string device_id = 3;
  string platform = 4;
}
// SessionUser is the (session, user) pair returned by register/login.
message SessionUser {
  Session session = 1;
  User user = 2;
}
message TokenRequest { string token = 1; }
message ResumeRequest { string resume_token = 1; }
// Identity is the resolved (session, user) behind a token/resume.
message Identity {
  Session session = 1;
  User user = 2;
}

// Session management and account deletion. These exist on the gRPC contract and
// not only on the local service because the gateway talks to ONE interface: a
// capability that is present in the monolith and absent behind gRPC is a feature
// that silently disappears when someone enables the split, which is the topology
// drift the risk register already names.
message UserIDRequest { string user_id = 1; }

message SessionRow {
  string id = 1;
  string user_id = 2;
  string device_id = 3;
  int64 created_at = 4;
  int64 expires_at = 5;
  int64 revoked_at = 6;
}
message SessionsReply { repeated SessionRow sessions = 1; }

message RevokeOwnedRequest {
  string user_id = 1;
  string session_id = 2;
}

message RevokeAllRequest {
  string user_id = 1;
  // keep_session_id is spared, which is how "sign out everywhere else" is said.
  string keep_session_id = 2;
}
message RevokeAllReply { int32 revoked = 1; }

message DeleteAccountRequest {
  string user_id = 1;
  string password = 2;
}

// LoginWithCodeRequest is LoginRequest plus the second factor. A separate message
// rather than an extra field on LoginRequest, so the existing call keeps its exact
// meaning for any caller that has not moved.
message LoginWithCodeRequest {
  string username = 1;
  string password = 2;
  string code = 3;
  string device_id = 4;
  string platform = 5;
}

message ChangePasswordRequest {
  string user_id = 1;
  string old_password = 2;
  string new_password = 3;
  // keep_session_id survives the revoke, so the caller is not signed out of the
  // device they are using to secure the account.
  string keep_session_id = 4;
}
message ChangePasswordReply { int32 sessions_revoked = 1; }

message BeginTOTPRequest {
  string user_id = 1;
  string issuer = 2;
}
message BeginTOTPReply {
  string secret = 1;
  string uri = 2;
}

message ConfirmTOTPRequest {
  string user_id = 1;
  string code = 2;
}
// The recovery codes, returned once. The stored form is a hash, so there is
// nothing to return later.
message ConfirmTOTPReply { repeated string recovery_codes = 1; }

message DisableTOTPRequest {
  string user_id = 1;
  string password = 2;
  string code = 3;
}

message TwoFactorStateReply {
  bool enabled = 1;
  int32 recovery_left = 2;
}

service AuthService {
  rpc Register(RegisterRequest) returns (SessionUser);
  rpc Login(LoginRequest) returns (SessionUser);
  rpc Authenticate(TokenRequest) returns (Identity);
  rpc Resume(ResumeRequest) returns (Identity);
  rpc ListSessions(UserIDRequest) returns (SessionsReply);
  rpc RevokeOwned(RevokeOwnedRequest) returns (Empty);
  rpc RevokeAll(RevokeAllRequest) returns (RevokeAllReply);
  rpc DeleteAccount(DeleteAccountRequest) returns (Empty);

  // Account security. None of this existed: the password could not be changed by
  // any path, and there was no second factor at all.
  rpc LoginWithCode(LoginWithCodeRequest) returns (SessionUser);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordReply);
  rpc BeginTOTP(BeginTOTPRequest) returns (BeginTOTPReply);
  rpc ConfirmTOTP(ConfirmTOTPRequest) returns (ConfirmTOTPReply);
  rpc DisableTOTP(DisableTOTPRequest) returns (Empty);
  rpc TwoFactorState(UserIDRequest) returns (TwoFactorStateReply);
}

// ---- Chat service ----

message DirectRequest {
  string user_a = 1;
  string user_b = 2;
}
message ChatIDRequest { string chat_id = 1; }
message CreateGroupRequest {
  string owner_id = 1;
  string title = 2;
  string type = 3;
  repeated string member_ids = 4;
}
message MembersReply { repeated ChatMember members = 1; }
message MemberIDsReply { repeated string user_ids = 1; }
// MemberPageRequest walks membership by keyset: ids after `after_user_id`,
// ordered, at most `limit`. Fanout needs this to stream a million-member channel
// instead of materializing it.
message MemberPageRequest {
  string chat_id = 1;
  string after_user_id = 2;
  int32 limit = 3;
}
// ChatUserRequest authorizes a user against a chat (CanPost / IsMember).
message ChatUserRequest {
  string chat_id = 1;
  string user_id = 2;
}
message BoolReply { bool ok = 1; }
// CountReply carries a plain tally. Its own message rather than reusing an
// existing reply, because a count is not a boolean and squeezing it into one
// would lose the number the caller actually needs.
message CountReply { int32 count = 1; }
message PinnedCountRequest {
  string user_id = 1;
  // Ignored by the count, so the caller can ask "how many OTHERS are pinned".
  string except_chat_id = 2;
}

// UserChatsRequest pages a user's chat list by keyset over the chat id. The
// whole summary is built inside the chat service: assembling it at the gateway
// would cost one Get (plus one Members for every direct chat) per row, turning
// one screen of chats into a burst of round trips.
message UserChatsRequest {
  string user_id = 1;
  string after = 2;
  int32 limit = 3;
}

message UserChatPageRequest {
  string user_id = 1;
  string after = 2;
  int64 after_activity = 3;
  int32 limit = 4;
  bool include_archived = 5;
}

message SetChatFlagsRequest {
  string chat_id = 1;
  string user_id = 2;
  int64 muted_until = 3;
  bool pinned = 4;
  bool archived = 5;
}

message ChatFlagsReply {
  int64 muted_until = 1;
  bool pinned = 2;
  bool archived = 3;
}
message ChatSummary {
  Chat chat = 1;
  string my_role = 2;
  string peer_id = 3;
  // What a chat list draws. Absent here meant the gateway had to fetch history
  // per chat to render its own list, which is the N+1 this whole change removes —
  // and in the split deployment it was an N+1 of RPCs.
  Message last_message = 4;
  int64 unread_count = 5;
  int64 last_activity_at = 6;
  int64 muted_until = 7;
  bool pinned = 8;
  bool archived = 9;
}
// ChatSummariesReply is one page of summaries. The cursor is not repeated here:
// it is the id of the last row, so the gateway derives it from the page itself
// and the monolith and the split deployment cannot disagree about it.
message ChatSummariesReply { repeated ChatSummary chats = 1; }

service ChatService {
  rpc EnsureDirect(DirectRequest) returns (Chat);
  // EnsureSecret is EnsureDirect for the SECRET type. A separate RPC rather than a
  // type field on DirectRequest, so the existing call keeps its exact meaning.
  rpc EnsureSecret(DirectRequest) returns (Chat);
  rpc FindDirect(DirectRequest) returns (Chat);
  rpc Get(ChatIDRequest) returns (Chat);
  rpc CreateGroup(CreateGroupRequest) returns (Chat);
  rpc Members(ChatIDRequest) returns (MembersReply);
  rpc UserChats(UserChatsRequest) returns (ChatSummariesReply);
  // UserChatPage is UserChats with the composite cursor and the archived filter.
  // Separate rather than extra fields on UserChatsRequest so the old call keeps
  // its exact meaning for any caller that has not moved.
  rpc UserChatPage(UserChatPageRequest) returns (ChatSummariesReply);
  // SetChatFlags writes the CALLER's own mute/pin/archive for a chat.
  rpc SetChatFlags(SetChatFlagsRequest) returns (ChatFlagsReply);
  // UserChatIDs lists the chats a user belongs to, ids only — what search needs
  // to bound a query. UserChats cannot serve it: it pages, and it builds full
  // summaries that the caller throws away.
  rpc UserChatIDs(UserIDRequest) returns (MemberIDsReply);
  rpc MemberIDs(ChatIDRequest) returns (MemberIDsReply);
  rpc MemberIDsPage(MemberPageRequest) returns (MemberIDsReply);
  // CanPost/IsMember are used by the message service (messaged is a client of
  // chatd) to authorize writes and reads.
  rpc CanPost(ChatUserRequest) returns (BoolReply);
  rpc IsMember(ChatUserRequest) returns (BoolReply);
  // CanModerate authorizes acting on ANOTHER member's message (deletion). It is
  // its own call rather than a flag on CanPost because the two answers differ in
  // exactly the case that matters: in a group every member may post and only
  // admins may moderate.
  rpc CanModerate(ChatUserRequest) returns (BoolReply);
  // CountPinnedChatsExcept backs the MaxPinnedChats entitlement, which the
  // gateway enforces because only the gateway knows the caller's tier. The
  // exclusion lets it answer "is there room for THIS chat" without tripping over
  // a client re-sending flags for one that is already pinned.
  rpc CountPinnedChatsExcept(PinnedCountRequest) returns (CountReply);
}

// ---- Message service (broker write path + read path) ----

enum Op {
  OP_UNSPECIFIED = 0;
  OP_CREATE = 1;
  OP_EDIT = 2;
  OP_DELETE = 3;
}
message SubmitRequest {
  Op op = 1;
  string actor_id = 2;
  string chat_id = 3;
  string message_id = 4;
  string dedup_key = 5;
  string text = 6;
  string media_ref = 7;
  string reply_to = 8;
  Attachment attachment = 9;
  // ttl_seconds self-destructs the created message that many seconds after it
  // lands (0 = never). The deadline is computed at the write path, not here, so
  // both deployments date a message from the same clock.
  int32 ttl_seconds = 10;
}
message SubmitReply {
  Message message = 1;
  bool duplicate = 2;
}
message HistoryRequest {
  string user_id = 1;
  string chat_id = 2;
  uint64 before_seq = 3;
  int32 limit = 4;
}
message HistoryReply { repeated Message messages = 1; }
message ThreadRequest {
  string user_id = 1;
  string chat_id = 2;
  string root_id = 3;
  uint64 after_seq = 4;
  int32 limit = 5;
}
message ForwardRequest {
  string user_id = 1;
  string src_chat_id = 2;
  string src_msg_id = 3;
  string dst_chat_id = 4;
  string dedup_key = 5;
}
message MarkReadRequest {
  string user_id = 1;
  string chat_id = 2;
  uint64 up_to_seq = 3;
}
message Empty {}

service MessageService {
  rpc Submit(SubmitRequest) returns (SubmitReply);
  rpc History(HistoryRequest) returns (HistoryReply);
  rpc Thread(ThreadRequest) returns (HistoryReply);
  rpc Forward(ForwardRequest) returns (SubmitReply);
  rpc MarkRead(MarkReadRequest) returns (Empty);
}

// ---- Presence service ----

message UserRequest { string user_id = 1; }
message TypingRequest {
  string chat_id = 1;
  string user_id = 2;
  bool active = 3;
}

service PresenceService {
  rpc Online(UserRequest) returns (Empty);
  rpc Heartbeat(UserRequest) returns (Empty);
  rpc Offline(UserRequest) returns (Empty);
  rpc Typing(TypingRequest) returns (Empty);
}

// ---- Key directory service (E2E prekeys) ----

message PublishRequest {
  string user_id = 1;
  string device_id = 2;
  string identity_key = 3;
  string signing_key = 4;
  string signed_prekey = 5;
  string signed_prekey_sig = 6;
  repeated string prekeys = 7;
}
message FetchRequest {
  string user_id = 1;
  string device_id = 2;
}
message KeyBundle {
  string user_id = 1;
  string device_id = 2;
  string identity_key = 3;
  string signing_key = 4;
  string signed_prekey = 5;
  string signed_prekey_sig = 6;
  string one_time_prekey = 7;
}
message FetchReply {
  KeyBundle bundle = 1;
  bool found = 2;
}
message FetchAllReply { repeated KeyBundle bundles = 1; }

// PublishReply mirrors keydir.State across the service boundary. Publishing used to
// be write-only here, so a gateway talking to a remote keydird could not tell its
// device what the directory now holds -- and nothing else can tell it, because
// one-time prekeys are consumed by PEERS fetching bundles.
message PublishReply {
  // Prekeys held AFTER this publish was applied and trimmed.
  int32 one_time_prekeys_left = 1;
  // Unix millis when the CURRENT signed prekey first appeared; 0 when unknown.
  int64 signed_prekey_first_seen_ms = 2;
  // How many prekeys from this request survived the caps.
  int32 accepted = 3;
}

service KeyDirService {
  rpc Publish(PublishRequest) returns (PublishReply);
  rpc Fetch(FetchRequest) returns (FetchReply);
  rpc FetchAll(UserRequest) returns (FetchAllReply);
}
