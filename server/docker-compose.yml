# Local infra for the SyncApp MVP: Postgres (durable metadata + message log),
# Redis (ephemeral presence), NATS (event bus). Bring it up, then run the server
# pointed at these via the env vars in Makefile's `run-server-infra` target.
#
# HOST PORTS ARE OVERRIDABLE. A developer machine very often already has a
# Postgres on 5432, and the symptom of the clash is confusing rather than
# obvious: the container starts healthy, connections from inside it succeed, and
# only connections from the HOST fail — with a password error from the *other*
# server, not a connection refused. Override in a `.env` next to this file or
# inline:
#
#   SYNCAPP_PG_PORT=55432 docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syncapp
      POSTGRES_PASSWORD: syncapp
      POSTGRES_DB: syncapp
    ports:
      # NOTE: POSTGRES_USER/PASSWORD are applied by initdb ONLY on first start of
      # a fresh volume. Changing them later has no effect until `docker compose
      # down -v` — or an `ALTER ROLE ... WITH PASSWORD` against the running one.
      - "${SYNCAPP_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # No initdb script: the server applies versioned migrations (golang-migrate,
      # internal/store/postgres/migrations) itself on boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${SYNCAPP_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js"] # enable JetStream for the durable-event upgrade path
    ports:
      - "${SYNCAPP_NATS_PORT:-4222}:4222"
      - "${SYNCAPP_NATS_MONITOR_PORT:-8222}:8222" # monitoring
    # Without this, `docker compose up --wait` returns as soon as the container
    # is running — which for NATS is before JetStream has finished initialising,
    # so the first integration run would fail to create a stream. The monitoring
    # endpoint answering is the readiness signal; the image is distroless-ish and
    # has no curl, so this uses the NATS CLI that does ship in it.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
