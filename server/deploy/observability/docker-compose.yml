# Observability stack for Synapse: Prometheus (metrics), Tempo (traces via OTLP),
# Grafana (dashboards). Run the server with:
#   SYNAPSE_OTLP_ENDPOINT=localhost:4318 SYNAPSE_WS_ADDR=:8080 go run ./cmd/server
# then `docker compose -f deploy/observability/docker-compose.yml up -d` and open
# Grafana at http://localhost:3000 (Explore → Prometheus / Tempo).
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # scrape the server on the host

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200" # tempo query
      - "4318:4318" # OTLP/HTTP ingest (SYNAPSE_OTLP_ENDPOINT)
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
