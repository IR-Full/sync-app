# L4/L7 load balancer in front of the horizontally-scaled gateway replicas.
# Clients connect here (:7000 raw TCP, :8080 WebSocket); HAProxy spreads new
# connections across every `gatewayd` replica it discovers via Docker's DNS.
# Because the gateway is stateless (all state is in Postgres/Redis/NATS) and any
# node can deliver to any other via the router+bus, a connection may land on ANY
# replica — that is exactly what makes scaling out a matter of raising the
# replica count.

global
    log stdout format raw local0 info
    maxconn 100000

defaults
    log     global
    timeout connect 5s
    timeout client  1h   # long-lived realtime connections
    timeout server  1h

# Discover gatewayd replica IPs through Docker's embedded DNS so scaling the
# replica count is picked up without editing this file.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 5s

# Raw-TCP binary protocol.
frontend tcp_in
    mode tcp
    bind *:7000
    default_backend gw_tcp
backend gw_tcp
    mode tcp
    balance leastconn
    # server-template pre-creates N slots that resolve to the replica IPs; unused
    # slots stay DOWN until more replicas exist.
    server-template gw 8 gatewayd:7000 check resolvers docker init-addr none

# WebSocket (HTTP upgrade) + health/metrics.
frontend ws_in
    mode http
    bind *:8080
    default_backend gw_ws
backend gw_ws
    mode http
    balance leastconn
    option httpchk
    http-check send meth GET uri /healthz
    server-template gw 8 gatewayd:8080 check resolvers docker init-addr none
