name: Synapse

options:
  bundleIdPrefix: chat.synapse
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  localPackagesGroup: Packages
  transitivelyLinkDependencies: true

configs:
  Dev: debug
  Stage: release
  Prod: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

# The package lives in a subdirectory, not here.
#
# A local package whose root is the directory that also holds the generated
# .xcodeproj does not resolve: the package would contain the project consuming
# it. Xcode reports that as `no such module` at the first import, which points
# at the app's source rather than at the reference that failed.
packages:
  Synapse:
    path: SynapseKit

targets:
  Synapse:
    type: application
    platform: iOS

    sources:
      - path: App

      - path: Resources
        buildPhase: resources

    info:
      path: App/Info.plist

    configFiles:
      Dev: Config/Dev.xcconfig
      Stage: Config/Stage.xcconfig
      Prod: Config/Prod.xcconfig

    # One entry per product. `products:` (plural) needs XcodeGen 2.28+; the
    # singular form has been supported since 2.x, and a spec key an older
    # XcodeGen does not understand is skipped silently — producing exactly the
    # same `no such module` with nothing in the log to say why.
    dependencies:
      - package: Synapse
        product: SynapseDI
      - package: Synapse
        product: SynapsePresentation

    settings:
      base:
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Synapse Dev:
    build:
      targets:
        Synapse: all
    run:
      config: Dev
    test:
      config: Dev

  Synapse Stage:
    build:
      targets:
        Synapse: all
    run:
      config: Stage
    test:
      config: Stage

  Synapse Prod:
    build:
      targets:
        Synapse: all
    run:
      config: Prod
    test:
      config: Prod