name: iOS CI

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test iOS app
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i iphone | tail -5

      # This step now compiles every target, including the SwiftUI layer, because
      # SynapsePresentationTests depends on SynapseDI. So it — not the app build
      # — is where a compile error should surface, with the file and line.
      # Hence no -quiet.
      - name: Run Swift package tests
        working-directory: ios/SynapseKit
        run: |
          set -euo pipefail

          xcodebuild test \
            -scheme Synapse-Package \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Compiler diagnostics (tests)
        if: failure()
        run: |
          echo "::group::Errors"
          grep -E "error:" "$RUNNER_TEMP/tests.log" | sort -u || echo "none"
          echo "::endgroup::"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -euo pipefail

          rm -rf Synapse.xcodeproj
          xcodegen generate

          # A local package that fails to attach produces no error here — the
          # failure surfaces much later as `no such module` pointing at the
          # app's first import, which says nothing about the reference that was
          # dropped. Assert the wiring directly instead.
          for product in SynapseDI SynapsePresentation; do
            if ! grep -q "$product" Synapse.xcodeproj/project.pbxproj; then
              echo "::error::$product is missing from the generated project — check the 'packages' path in project.yml"
              exit 1
            fi
          done

      - name: Resolve Swift package dependencies
        working-directory: ios
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Synapse.xcodeproj \
            -scheme 'Synapse Dev' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages"

      - name: Build the app
        working-directory: ios
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/synapse-derived-data"

          # Deliberately not -quiet. When a package target fails to compile, the
          # only line -quiet lets through is the app's downstream
          # `no such module`, which names the import rather than the broken file.
          #
          # The configuration is `Dev`, not `Debug`: project.yml names the three
          # configurations Dev/Stage/Prod, and there is no Debug to select.
          #
          # `set -o pipefail` is already on, so tee does not mask a failure.
          xcodebuild build \
            -project Synapse.xcodeproj \
            -scheme 'Synapse Dev' \
            -configuration Dev \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -derivedDataPath "$RUNNER_TEMP/synapse-derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/source-packages" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # The full log is long; this is the part worth reading first.
      - name: Compiler diagnostics
        if: failure()
        run: |
          echo "::group::Errors"
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u || echo "none"
          echo "::endgroup::"

      - name: Launch app and create screenshot
        working-directory: ios
        run: |
          set -euo pipefail

          UDID="$(
            python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(
              subprocess.check_output(
                  [
                      "xcrun",
                      "simctl",
                      "list",
                      "devices",
                      "available",
                      "-j",
                  ],
                  text=True,
              )
          )["devices"]

          iphones = [
              device["udid"]
              for runtime, device_list in devices.items()
              for device in device_list
              if runtime.endswith("iOS-17-5")
              and device["name"] == "iPhone 15"
          ]

          if not iphones:
              raise SystemExit(
                  "iPhone 15 with iOS 17.5 simulator not found"
              )

          print(iphones[0])
          PY
          )"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP="$(
            find "$RUNNER_TEMP/synapse-derived-data" \
              -type d \
              -name '*.app' \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -z "$APP" ]; then
            echo "::error::Application bundle was not found"

            echo "::group::DerivedData contents"
            find "$RUNNER_TEMP/synapse-derived-data" \
              -maxdepth 8 \
              -print || true
            echo "::endgroup::"

            exit 1
          fi

          echo "Installing app: $APP"

          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" chat.synapse.ios.dev

          sleep 8

          xcrun simctl io "$UDID" screenshot launch.png

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: ios/launch.png
          if-no-files-found: warn